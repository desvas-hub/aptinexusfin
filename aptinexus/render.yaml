services:
  - type: web
    name: aptinexus-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DATABASE_URL
        fromDatabase:
          name: aptinexus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: aptinexus-db
    databaseName: aptinexus
    user: aptinexus
    plan: free
    region: singapore
    ipAllowList: []
